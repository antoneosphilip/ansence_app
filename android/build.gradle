buildscript {
    ext.kotlin_version = '2.0.21'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects {
    plugins.withId("com.android.library") {
        if (project.android.namespace == null) {
            try {
                def manifest = file("${project.projectDir}/src/main/AndroidManifest.xml")
                if (manifest.exists()) {
                    def pattern = ~/package=["']([^"']+)["']/
                    def matcher = pattern.matcher(manifest.text)
                    if (matcher.find()) {
                        project.android.namespace = matcher.group(1)
                    }
                }
            } catch (Exception ignored) {
            }
            if (project.android.namespace == null) {
                project.android.namespace = "com.example.${project.name.replaceAll('[^a-zA-Z0-9_]', '_')}"
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
